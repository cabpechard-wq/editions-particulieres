name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'flipcards/**'
      - 'packages/**'
      - 'extract/**'
      - 'export_html.py'
      - 'export_dictionnaire.py'
      - 'export_arrets.py'
      - 'scripts/fix_legacy_crumbs.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      refresh_notion:
        description: "Re-exporter manuel/dictionnaire depuis Notion (lent, rate limits)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Prepare config
        run: |
          if [ ! -f site/config.json ]; then
            cp site/config.json.example site/config.json
          fi
          if [ ! -f config/notion.json ]; then
            cp config/notion.json.example config/notion.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("site/config.json")
          cfg = json.loads(path.read_text(encoding="utf-8"))
          base = "https://www.editions-particulieres.fr"
          hosting = cfg.setdefault("hosting", {})
          hosting["base_url"] = base
          hosting["custom_domain"] = "www.editions-particulieres.fr"
          cfg["checkout_url"] = f"{base}/checkout/"
          cfg["demo_url"] = f"{base}/demo/"
          cfg["flipcards_url"] = f"{base}/flipcards/"
          cfg["merci_url"] = f"{base}/merci/?session_id={{CHECKOUT_SESSION_ID}}"
          legal = cfg.setdefault("legal", {})
          legal["cgv_url"] = f"{base}/cgv/"
          legal["mentions_url"] = f"{base}/mentions-legales/"
          path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("base_url:", base)
          PY
      - name: Export flipcards matrice
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Tentative $attempt/3…"
            python -m flipcards.export_matrice && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 45
          done
          rows=$(python -c "import csv; print(sum(1 for _ in csv.reader(open('flipcards/matrices/flipcards_matrice.csv', encoding='utf-8'))) - 1)")
          echo "Matrice : $rows lignes"
          if [ "$rows" -lt 900 ]; then
            echo "::error::Export Notion incomplet ($rows lignes, attendu ~995). Réessayez plus tard."
            exit 1
          fi
      - name: Build static site
        working-directory: site
        run: python build_assets.py

      # Contourne les rate limits Notion : on réutilise le contenu déjà publié
      # sauf si workflow_dispatch → refresh_notion=true.
      - name: Seed manuel/dictionnaire from live Pages
        id: seed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_notion != true }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Prefer custom domain; fall back to github.io. Reject OVH "site en construction"
          # pages that poisoned a previous deploy during DNS cutover.
          # cut-dirs: github.io a le préfixe /editions-particulieres/ ; www non.
          try_seed() {
            local BASE="$1"
            local CUT="$2"
            echo "Tentative seed depuis $BASE (cut-dirs=$CUT) …"
            rm -rf site/dist/site/manuel site/dist/site/dictionnaire
            for path in manuel dictionnaire; do
              wget -q -r -np -nH --cut-dirs="$CUT" --level=inf \
                --reject-regex '[?]' \
                -P site/dist/site \
                "$BASE/$path/" || return 1
              f="site/dist/site/$path/index.html"
              test -f "$f" || return 1
              if grep -qiE 'Site en construction|OVHcloud|/__ovh/' "$f"; then
                echo "::warning::Seed $path depuis $BASE = page OVH (ignoré)"
                return 1
              fi
            done
            return 0
          }
          mkdir -p site/dist/site
          if try_seed "https://www.editions-particulieres.fr" 0; then
            :
          elif try_seed "https://cabpechard-wq.github.io/editions-particulieres" 1; then
            :
          else
            echo "Seed impossible depuis les miroirs live"
            exit 1
          fi
          test -f site/dist/site/manuel/index.html
          test -f site/dist/site/dictionnaire/index.html
          manuel_pages=$(find site/dist/site/manuel -name 'index.html' | wc -l)
          dict_pages=$(find site/dist/site/dictionnaire -name 'index.html' | wc -l)
          echo "Seed pages : manuel=$manuel_pages dictionnaire=$dict_pages"
          if [ "$manuel_pages" -lt 15 ]; then
            echo "::warning::Seed manuel incomplet ($manuel_pages pages HTML, attendu >= 15)"
            exit 1
          fi
          if [ "$dict_pages" -lt 1 ]; then
            echo "::warning::Seed dictionnaire vide"
            exit 1
          fi
          echo "Seed OK ($(du -sh site/dist/site/manuel site/dist/site/dictionnaire | tr '\n' ' '))"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Export manuel HTML into site
        if: ${{ inputs.refresh_notion == true || steps.seed.outcome != 'success' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MANUEL_DATABASE_URL: ${{ secrets.NOTION_MANUEL_DATABASE_URL }}
        run: python export_html.py --out site/dist/site

      - name: Export dictionnaire HTML into site
        if: ${{ inputs.refresh_notion == true || steps.seed.outcome != 'success' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          # Laisse le quota Notion respirer après le manuel (si exporté juste avant)
          if [ "${{ inputs.refresh_notion }}" = "true" ] || [ "${{ steps.seed.outcome }}" != "success" ]; then
            if [ -f site/dist/site/manuel/index.html ]; then
              echo "Pause 60s avant glossaire (anti rate-limit)…"
              sleep 60
            fi
          fi
          python export_dictionnaire.py --out site/dist/site

      - name: Export arrêts HTML into site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python export_arrets.py --out site/dist/site

      - name: Retirer fil d'Ariane legacy (Éditions Particulières)
        run: |
          python scripts/fix_legacy_crumbs.py \
            site/dist/site/manuel \
            site/dist/site/dictionnaire \
            site/dist/site/arrets

      - name: Refresh auth.js (URL API injectée)
        working-directory: site
        run: python build_membre_gate.py

      - name: Verify site artifact
        run: |
          test -f site/dist/site/manuel/index.html || (echo "::error::Manuel absent" && exit 1)
          test -f site/dist/site/dictionnaire/index.html || (echo "::error::Dictionnaire absent" && exit 1)
          test -f site/dist/site/arrets/index.html || (echo "::error::Arrêts absent" && exit 1)
          for path in manuel dictionnaire; do
            if grep -qiE 'Site en construction|OVHcloud|/__ovh/' "site/dist/site/$path/index.html"; then
              echo "::error::$path contient encore la page OVH « site en construction »"
              exit 1
            fi
          done
          if grep -q '__AUTH_API__' site/dist/site/auth.js; then
            echo "::warning::auth.js contient encore __AUTH_API__ (repli Worker actif)"
          fi
          grep -q 'workers.dev' site/dist/site/auth.js || (echo "::error::auth.js sans URL Worker" && exit 1)
          grep -q 'buy.stripe.com' site/dist/site/checkout/index.html \
            || (echo "::error::checkout sans Payment Links Stripe" && exit 1)
          echo "Artefact OK."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
