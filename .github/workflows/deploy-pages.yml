name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'flipcards/**'
      - 'packages/**'
      - 'extract/**'
      - 'export_html.py'
      - 'export_dictionnaire.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Prepare config
        run: |
          if [ ! -f site/config.json ]; then
            cp site/config.json.example site/config.json
          fi
          if [ ! -f config/notion.json ]; then
            cp config/notion.json.example config/notion.json
          fi
      - name: Export flipcards matrice
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Tentative $attempt/3…"
            python -m flipcards.export_matrice && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 45
          done
          rows=$(python -c "import csv; print(sum(1 for _ in csv.reader(open('flipcards/matrices/flipcards_matrice.csv', encoding='utf-8'))) - 1)")
          echo "Matrice : $rows lignes"
          if [ "$rows" -lt 900 ]; then
            echo "::error::Export Notion incomplet ($rows lignes, attendu ~995). Réessayez plus tard."
            exit 1
          fi
      - name: Build static site
        working-directory: site
        run: python build_assets.py
      - name: Export manuel HTML into site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MANUEL_DATABASE_URL: ${{ secrets.NOTION_MANUEL_DATABASE_URL }}
        run: python export_html.py --out site/dist/site
      - name: Export dictionnaire HTML into site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python export_dictionnaire.py --out site/dist/site
      - name: Refresh auth.js (URL API injectée)
        working-directory: site
        run: python build_membre_gate.py
      - name: Verify manuel and dictionnaire in artifact
        run: |
          test -f site/dist/site/manuel/index.html || (echo "::error::Manuel absent — export_html.py a échoué ou n'a rien produit" && exit 1)
          test -f site/dist/site/dictionnaire/index.html || (echo "::error::Dictionnaire absent — export_dictionnaire.py a échoué ou n'a rien produit" && exit 1)
          echo "Manuel et dictionnaire présents dans l'artefact."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
