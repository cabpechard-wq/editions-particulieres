[project]
name = "editions-particulieres"
version = "1.0.0"
description = "Éditions Particulières — extraction Notion, flipcards, site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "notion-client>=2.5.0",
  "python-dotenv>=1.0.0",
  "python-docx>=1.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "extract*", "flipcards*", "gui*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
