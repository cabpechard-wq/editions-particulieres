name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'flipcards/**'
      - 'packages/**'
      - 'extract/**'
      - 'export_html.py'
      - 'export_dictionnaire.py'
      - 'export_arrets.py'
      - 'scripts/fix_legacy_crumbs.py'
      - 'scripts/seed_live_html.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      refresh_notion:
        description: "Re-exporter manuel/dictionnaire depuis Notion (lent, rate limits)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Prepare config
        run: |
          if [ ! -f site/config.json ]; then
            cp site/config.json.example site/config.json
          fi
          if [ ! -f config/notion.json ]; then
            cp config/notion.json.example config/notion.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("site/config.json")
          cfg = json.loads(path.read_text(encoding="utf-8"))
          base = "https://www.editions-particulieres.fr"
          hosting = cfg.setdefault("hosting", {})
          hosting["base_url"] = base
          hosting["custom_domain"] = "www.editions-particulieres.fr"
          cfg["checkout_url"] = f"{base}/checkout/"
          cfg["demo_url"] = f"{base}/demo/"
          cfg["flipcards_url"] = f"{base}/flipcards/"
          cfg["merci_url"] = f"{base}/merci/?session_id={{CHECKOUT_SESSION_ID}}"
          legal = cfg.setdefault("legal", {})
          legal["cgv_url"] = f"{base}/cgv/"
          legal["mentions_url"] = f"{base}/mentions-legales/"
          path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("base_url:", base)
          PY
      - name: Export flipcards matrice
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Tentative $attempt/3…"
            python -m flipcards.export_matrice && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 45
          done
          rows=$(python -c "import csv; print(sum(1 for _ in csv.reader(open('flipcards/matrices/flipcards_matrice.csv', encoding='utf-8'))) - 1)")
          echo "Matrice : $rows lignes"
          if [ "$rows" -lt 900 ]; then
            echo "::error::Export Notion incomplet ($rows lignes, attendu ~995). Réessayez plus tard."
            exit 1
          fi
      - name: Build static site
        working-directory: site
        run: python build_assets.py

      # Contourne les rate limits Notion : on réutilise le contenu déjà publié
      # sauf si workflow_dispatch → refresh_notion=true.
      # github.io redirige vers www : wget -np ne récursait qu'une page ; seed Python.
      - name: Seed manuel/dictionnaire from live Pages
        id: seed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_notion != true }}
        continue-on-error: true
        run: python scripts/seed_live_html.py --out site/dist/site

      - name: Export manuel HTML into site
        if: ${{ inputs.refresh_notion == true || steps.seed.outcome != 'success' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MANUEL_DATABASE_URL: ${{ secrets.NOTION_MANUEL_DATABASE_URL }}
        run: python export_html.py --out site/dist/site

      - name: Export dictionnaire HTML into site
        if: ${{ inputs.refresh_notion == true || steps.seed.outcome != 'success' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          # Laisse le quota Notion respirer après le manuel (si exporté juste avant)
          if [ "${{ inputs.refresh_notion }}" = "true" ] || [ "${{ steps.seed.outcome }}" != "success" ]; then
            if [ -f site/dist/site/manuel/index.html ]; then
              echo "Pause 60s avant glossaire (anti rate-limit)…"
              sleep 60
            fi
          fi
          python export_dictionnaire.py --out site/dist/site

      - name: Export arrêts HTML into site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python export_arrets.py --out site/dist/site

      - name: Retirer fil d'Ariane legacy (Éditions Particulières)
        run: |
          python scripts/fix_legacy_crumbs.py \
            site/dist/site/manuel \
            site/dist/site/dictionnaire \
            site/dist/site/arrets

      - name: Refresh auth.js (URL API injectée)
        working-directory: site
        run: python build_membre_gate.py

      - name: Index recherche full-text (Cours + Dictionnaire + Arrêts)
        working-directory: site
        run: python build_search_index.py

      - name: Smoke artefact (dist/site)
        working-directory: site
        run: python smoke_artifact.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  smoke:
    name: Smoke live (Pages)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke deps
        run: pip install httpx certifi
      - name: Attendre propagation CDN
        run: sleep 20
      - name: Smoke HTTP (www + fallback github.io)
        run: |
          # www peut avoir un certificat GitHub Pages invalide / en cours
          # de renouvellement (Hostname mismatch) : on smoke github.io en secours.
          python site/smoke_live.py \
            --base https://www.editions-particulieres.fr \
            --base https://cabpechard-wq.github.io/editions-particulieres \
            --retries 12 \
            --sleep 20
      - name: Smoke commerce config (URLs)
        working-directory: site
        run: |
          if [ ! -f config.json ]; then cp config.json.example config.json; fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("config.json")
          cfg = json.loads(path.read_text(encoding="utf-8"))
          base = "https://www.editions-particulieres.fr"
          cfg["demo_url"] = f"{base}/demo/"
          cfg["flipcards_url"] = f"{base}/flipcards/"
          cfg.setdefault("stripe", {})
          cfg["stripe"]["monthly_payment_link"] = cfg.get("stripe", {}).get("monthly_payment_link") or cfg.get("lemonsqueezy", {}).get("monthly_checkout_url") or "https://buy.stripe.com/6oUaEWgWQgc21PO8QPawo01"
          cfg["stripe"]["yearly_payment_link"] = cfg.get("stripe", {}).get("yearly_payment_link") or cfg.get("lemonsqueezy", {}).get("yearly_checkout_url") or "https://buy.stripe.com/14AdR88qk3pgeCA0kjawo00"
          cfg.setdefault("auth", {})["api_url"] = cfg.get("auth", {}).get("api_url") or "https://flipcards-auth.cab-pechard.workers.dev"
          path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          python test_commerce.py --skip-artifact
